<body>
<div class="app-wrapper">
<!-- ADMIN SIDEBAR -->
<aside class="sidebar">
<div class="sidebar-brand">
<a class="sidebar-logo" href="../index.html">
<div class="sidebar-logo-badge" style="background: #EF4444;"><i class="bi bi-shield-lock-fill"></i></div>
<span>Prep<span style="color: #F87171;">Admin</span></span>
</a>
</div>
<div class="sidebar-content">
<div class="nav-section-title">CATEGORIES</div>
<ul class="sidebar-nav">
<li class="sidebar-nav-item"><a class="sidebar-nav-link" href="./categories.html"><i class="bi bi-arrow-left"></i> <span>Back to Categories</span></a></li>
</ul>
</div>
</aside>
<!-- MAIN VIEWPORT -->
<div class="main-wrapper">
<header class="topbar">
<div class="topbar-left">
<div class="breadcrumb">
<a href="./categories.html">Categories</a>
<span class="breadcrumb-separator">/</span>
<span style="color: var(--color-text-primary); font-weight: 600;">Category Editor</span>
</div>
</div>
<div class="topbar-right">
<button class="btn btn-primary btn-sm" onclick="if (window.saveCategory) { window.saveCategory(); }">
<i class="bi bi-floppy"></i> Save Category
        </button>
</div>
</header>
<main class="page-container" style="max-width: 860px;">
<div class="page-header">
<div>
<h1>Create / Edit Category Taxonomy</h1>
<p>Configure hierarchical attributes, slug routing, and display ordering.</p>
</div>
</div>
<div class="card p-6">
<form id="category-form" onsubmit="event.preventDefault(); if (window.saveCategory) { window.saveCategory(); }">
<div class="form-group">
<label class="form-label">Category Name <span class="required">*</span></label>
<input class="form-control" id="cat-name" placeholder="e.g. Backend Development" required="" type="text"/>
</div>
<div class="form-group">
<label class="form-label">Slug</label>
<input class="form-control" id="cat-slug" placeholder="e.g. backend-development" type="text"/>
</div>
<div class="form-group">
<label class="form-label">Description</label>
<textarea class="form-control" id="cat-desc" placeholder="Summary of topics under this category..." rows="3"></textarea>
</div>
<div class="grid-2">
<div class="form-group">
<label class="form-label">Bootstrap Icon Class</label>
<input class="form-control" id="cat-icon" type="text" value="bi-hdd-network"/>
</div>
<div class="form-group">
<label class="form-label">Display Order</label>
<input class="form-control" id="cat-order" type="number" value="1"/>
</div>
</div>
<div class="d-flex justify-content-end gap-2 pt-4" style="border-top: 1px solid var(--color-divider);">
<a class="btn btn-secondary btn-sm" href="./categories.html">Cancel</a>
<button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-floppy"></i> Save Category</button>
</div>
</form>
</div>
</main>
</div>
</div>






</body>
