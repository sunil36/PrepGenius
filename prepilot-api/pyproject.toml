[project]
name = "prepilot-api"
version = "0.1.0"
description = "PrepPilot Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncmy>=0.2.9",
    "alembic>=1.13.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
