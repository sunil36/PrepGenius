<body>
<div class="app-wrapper">
<!-- ADMIN SIDEBAR -->
<aside class="sidebar">
<div class="sidebar-brand">
<a class="sidebar-logo" href="../index.html">
<div class="sidebar-logo-badge" style="background: #EF4444;"><i class="bi bi-shield-lock-fill"></i></div>
<span>Prep<span style="color: #F87171;">Admin</span></span>
</a>
</div>
<div class="sidebar-content">
<div class="nav-section-title">QUESTIONS</div>
<ul class="sidebar-nav">
<li class="sidebar-nav-item"><a class="sidebar-nav-link" href="./questions.html"><i class="bi bi-arrow-left"></i> <span>Back to Questions</span></a></li>
</ul>
</div>
</aside>
<!-- MAIN VIEWPORT -->
<div class="main-wrapper">
<header class="topbar">
<div class="topbar-left">
<div class="breadcrumb">
<a href="./questions.html">Questions</a>
<span class="breadcrumb-separator">/</span>
<span style="color: var(--color-text-primary); font-weight: 600;">Question Editor</span>
</div>
</div>
<div class="topbar-right">
<button class="btn btn-primary btn-sm" onclick="saveQuestion()">
<i class="bi bi-floppy"></i> Save Question
        </button>
</div>
</header>
<main class="page-container" style="max-width: 960px;">
<div class="page-header">
<div>
<h1>Create / Edit Interview Question</h1>
<p>Structure the complete question payload: short answer, in-depth breakdown, and interview tips.</p>
</div>
</div>
<div class="card p-6">
<form id="q-form" onsubmit="event.preventDefault(); saveQuestion();">
<div class="grid-2">
<div class="form-group">
<label class="form-label">Question Type</label>
<select class="form-select" id="q-type">
<option selected="">Conceptual</option>
<option>Scenario</option>
<option>System Design</option>
<option>HR &amp; Behavioral</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Difficulty</label>
<select class="form-select" id="q-diff">
<option>Beginner</option>
<option selected="">Intermediate</option>
<option>Advanced</option>
</select>
</div>
</div>
<div class="form-group">
<label class="form-label">Question Title / Prompt <span class="required">*</span></label>
<input class="form-control" id="q-title" required="" type="text" value="Explain the difference between __new__ and __init__ in Python."/>
</div>
<div class="form-group">
<label class="form-label">Short Answer (1-2 sentences) <span class="required">*</span></label>
<textarea class="form-control" id="q-short" required="" rows="2">__new__ is the static creator method that actually instantiates and returns the object instance, while __init__ is the initializer method that configures attributes on that created instance.</textarea>
</div>
<div class="form-group">
<label class="form-label">Senior Interview Strategy Tips</label>
<textarea class="form-control" id="q-tips" rows="2">Mention immutable types (like tuple or int subclassing) and singleton design patterns as classic use-cases for overriding __new__.</textarea>
</div>
<div class="form-group">
<label class="form-label">Common Candidate Pitfalls</label>
<textarea class="form-control" id="q-pitfalls" rows="2">Thinking __init__ is the constructor. It is solely an initializer; __new__ is the constructor.</textarea>
</div>
<div class="d-flex justify-content-end gap-2 pt-4" style="border-top: 1px solid var(--color-divider);">
<a class="btn btn-secondary btn-sm" href="./questions.html">Cancel</a>
<button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-floppy"></i> Save Question</button>
</div>
</form>
</div>
</main>
</div>
</div>






</body>
